name: Debug Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the pre-release (e.g. 0.2.0)'
        required: true
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew assembleDebug -PversionName="${VERSION}"

      - name: Rename debug APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/bittr-v${VERSION}-debug.apk"

      - name: Upload debug APK as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}-debug" \
            "app/build/outputs/apk/debug/bittr-v${VERSION}-debug.apk" \
            --title "Bittr v${VERSION} (debug)" \
            --notes "Debug build (Logs tab + Timber + Hyperion)." \
            --prerelease