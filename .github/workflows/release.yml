name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true
        type: string
      versionCode:
        description: 'Version code (integer)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          ARGS="assembleRelease -PversionName=${VERSION}"

          if [ -n "${VERSION_CODE}" ]; then
            ARGS="${ARGS} -PversionCode=${VERSION_CODE}"
          fi

          ./gradlew ${ARGS}

      - name: Rename release APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/bittr-v${VERSION}-release.apk"

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRE=""

          if [ "${PRERELEASE}" = "true" ]; then
            PRE="--prerelease"
          fi

          gh release create "v${VERSION}" \
            "app/build/outputs/apk/release/bittr-v${VERSION}-release.apk" \
            --title "Bittr v${VERSION}" \
            --notes "Release build (no logging). Signed with debug key for sideloading." \
            ${PRE}